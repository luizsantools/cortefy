<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 50" width="250" height="50" fill="none">
  <!-- Neo-Brutalist Icon Box with hard shadow -->
  <g transform="translate(4, 4)">
    <!-- Hard black shadow -->
    <rect x="3" y="3" width="40" height="40" rx="8" fill="#000000"/>
    <!-- Orange box with 2.5px black border -->
    <rect width="40" height="40" rx="8" fill="#FF5C00" stroke="#000000" stroke-width="2.5"/>
    <!-- Play cut icon inside -->
    <path d="M 16 12 L 30 20 L 16 28 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 28 11 L 32 7" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Typography "CORTEFY" in bold neo-brutalist black -->
  <text x="56" y="33" font-family="'Space Grotesk', 'Plus Jakarta Sans', -apple-system, sans-serif" font-size="24" font-weight="900" fill="#000000" letter-spacing="-0.8">CORTEFY</text>
  
  <!-- Neo-Brutalist Cobalt Blue Pill Sticker -->
  <g transform="translate(178, 14)">
    <rect x="2" y="2" width="46" height="22" rx="6" fill="#000000"/>
    <rect width="46" height="22" rx="6" fill="#0052FF" stroke="#000000" stroke-width="2"/>
    <text x="10" y="15" font-family="'JetBrains Mono', 'Space Grotesk', monospace" font-size="11" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">VIRAL</text>
  </g>
</svg>

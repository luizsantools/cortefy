<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50" fill="none">
  <defs>
    <linearGradient id="logoNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="100%" stop-color="#00DF82"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Icon Badge -->
  <g transform="translate(4, 5)">
    <rect width="40" height="40" rx="10" fill="#0A0A0A" stroke="#222222" stroke-width="1.5"/>
    <path d="M 24 11 C 16 11 11 15.5 11 20 C 11 24.5 16 29 24 29 C 26.5 29 28.5 28.2 30 27" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 19 14 L 29 20 L 19 26 Z" fill="url(#logoNeon)" filter="url(#logoGlow)"/>
  </g>
  
  <!-- Typography "CORTEFY" -->
  <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">CORTEFY</text>
  
  <!-- AI pill badge -->
  <rect x="168" y="16" width="32" height="18" rx="5" fill="#0D1F14" stroke="#00FF66" stroke-width="1" stroke-opacity="0.4"/>
  <text x="175" y="29" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#00FF66">AI</text>
</svg>
